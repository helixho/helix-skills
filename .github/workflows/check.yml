name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install check dependency
        run: python -m pip install -r skills/helix-skill-review/scripts/requirements.txt
      - name: Check skills and run tests
        run: python scripts/check.py
